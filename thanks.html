<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you – Tactiq Labs</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #ffffff; --fg: #0f1720; --muted: #566070; --accent: #0f9d58;
    --accent-dark: #0b7a44; --soft: #f3f7f5; --border: #dfe8e3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0a0f0d; --fg: #eef4f0; --muted: #9baba3; --soft: #111a16; --border: #1f2e27; --accent: #22c55e; --accent-dark: #16a34a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg); line-height: 1.6; text-align: center; }
  .box { max-width: 480px; }
  .logo { font-weight: 800; font-size: 1.25rem; letter-spacing: -0.02em; text-decoration: none; color: inherit; display: inline-block; margin-bottom: 32px; }
  .logo span { color: var(--accent); }
  .check { display: inline-grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; background: var(--soft); border: 1px solid var(--border); color: var(--accent); font-size: 1.8rem; font-weight: 700; margin-bottom: 20px; }
  h1 { font-size: clamp(1.8rem, 5vw, 2.4rem); line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 12px; }
  p { color: var(--muted); font-size: 1.1rem; margin: 0 0 28px; }
  .btn { display: inline-block; background: var(--accent); color: #fff; padding: 12px 22px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 1rem; }
  .btn:hover { background: var(--accent-dark); }
</style>
</head>
<body>
  <div class="box">
    <a class="logo" href="index.html">Tactiq<span>Labs</span></a>
    <div><div class="check" aria-hidden="true">✓</div></div>
    <h1>Thank you!</h1>
    <p>We received your message and will be in touch soon.</p>
    <a class="btn" href="index.html">Back to home</a>
  </div>
</body>
</html>
